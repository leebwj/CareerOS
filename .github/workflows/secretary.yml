name: secretary

on:
  schedule:
    # 23:00 UTC = 08:00 KST, every day including weekends. Korea has no DST, so
    # this never drifts. It lands ~3.5h after the 19:23 UTC role-grabber run, so
    # the feed the brief reads is current.
    #
    # This used to run on Brian's PC via Task Scheduler, which meant no brief on
    # any day the machine was off — every weekend, in practice — and a "morning"
    # brief that actually arrived at whatever time he booted.
    - cron: "0 23 * * *"
  workflow_dispatch: {}

# Nothing is written back to the repo; the brief goes out by email.
permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compose + send the morning brief
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TRACKER_SHEET_URL: ${{ secrets.TRACKER_SHEET_URL }}
          BRIEF_TZ: Asia/Seoul
        # --quiet keeps the brief body out of the job log. This repo is public,
        # and the follow-up section names the companies Brian has applied to.
        run: node apps/secretary/run.mjs --quiet
