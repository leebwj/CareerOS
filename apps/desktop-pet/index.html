<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:transparent; overflow:hidden; font-family:"Segoe UI Variable", "Segoe UI", sans-serif; -webkit-user-select:none; user-select:none; }
  /* the stage fills the window but is click-through; children opt back in */
  #stage { position:absolute; inset:0; }

  /* ── the character (PLACEHOLDER — swap for your own art) ──
     Replace #pet's contents with an <img>/<canvas>/sprite. Keep the
     .interactive class so clicks register over it. */
  /* The character keeps its 120px internal geometry (eyes/blush are positioned
     in px against it) and the WRAPPER scales the whole thing — change --pet-scale
     alone to resize, nothing inside needs touching. */
  :root { --pet-scale:.5; --pet-size:120px; }
  #petwrap { position:absolute; bottom:6px; right:10px; width:var(--pet-size); height:var(--pet-size);
    transform:scale(var(--pet-scale)); transform-origin:bottom right; cursor:pointer; }
  #pet { position:absolute; inset:0; animation:bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-8px) } }
  .blob { position:absolute; inset:0; border-radius:46% 54% 50% 50% / 55% 55% 45% 45%;
    background:linear-gradient(160deg, #9aafe2, #6f88cf 60%, #4d67ad);
    box-shadow:0 8px 24px rgba(77,103,173,.45), inset 0 -8px 16px rgba(0,0,0,.15), inset 0 6px 12px rgba(255,255,255,.3); }
  .eye { position:absolute; top:44px; width:15px; height:19px; background:#0b0c0e; border-radius:50%; }
  .eye.l { left:36px; } .eye.r { right:36px; }
  .eye::after { content:""; position:absolute; top:3px; left:3px; width:5px; height:5px; background:#fff; border-radius:50%; }
  .blush { position:absolute; top:62px; width:14px; height:8px; background:rgba(255,138,138,.5); border-radius:50%; }
  .blush.l { left:24px; } .blush.r { right:24px; }
  #petwrap.talking .blob, #pet.talking .blob { animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.05) } }
  /* blink */
  #pet .eye { animation:blink 5s infinite; }
  @keyframes blink { 0%,96%,100%{ transform:scaleY(1) } 98%{ transform:scaleY(.1) } }

  /* ── speech bubble ── */
  #bubble { position:absolute; bottom:calc(var(--pet-size) * var(--pet-scale) + 16px); right:14px; width:340px;
    max-height:calc(100vh - var(--pet-size) * var(--pet-scale) - 34px); overflow:auto;
    background:rgba(21,23,26,.97); color:#f4f5f7; border:1px solid #2a2e35; border-radius:16px;
    padding:16px 18px; font-size:13.5px; line-height:1.5; box-shadow:0 12px 40px rgba(0,0,0,.5);
    opacity:0; transform:translateY(8px) scale(.98); transition:opacity .25s, transform .25s; pointer-events:none; }
  #bubble.show { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  #bubble::after { content:""; position:absolute; bottom:-9px; right:26px; width:16px; height:16px;
    background:rgba(21,23,26,.97); border-right:1px solid #2a2e35; border-bottom:1px solid #2a2e35; transform:rotate(45deg); }
  #bubble h2 { font-size:15px; margin:0 0 8px; }
  #bubble h3 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#9aafe2; margin:14px 0 5px; }
  #bubble a { color:#9aafe2; }
  #bubble .line { margin:3px 0; }
  #bubble b { color:#fff; }
  #close { position:absolute; top:9px; right:11px; color:#545c66; cursor:pointer; font-size:16px; line-height:1; }
  #close:hover { color:#f4f5f7; }
  .interactive { pointer-events:auto; }
</style>
</head>
<body>
<div id="stage">
  <div id="bubble" class="interactive"><span id="close">✕</span><div id="content"></div></div>
  <div id="petwrap" class="interactive">
  <div id="pet">
    <div class="blob"></div>
    <div class="eye l"></div><div class="eye r"></div>
    <div class="blush l"></div><div class="blush r"></div>
  </div>
  </div>
</div>

<script>
  // NB: NOT `pet` — the preload exposes window.pet via contextBridge as a
  // non-configurable property, and a top-level `const pet` collides with it,
  // killing the whole script with "Identifier 'pet' has already been declared".
  const petEl = document.getElementById("petwrap");
  const bubble = document.getElementById("bubble");
  const content = document.getElementById("content");

  const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

  // Renders the live brief. Leads with the ROLES, not the totals: "67 hot"
  // tells you nothing you can act on, whereas naming the newest target role and
  // linking straight to it means the pet can replace opening the tracker.
  function briefToHtml(res) {
    if (!res || !res.ok) {
      return `<h2>☀️ Morning brief</h2><div class="line">Couldn't reach the feed just now${res && res.error ? ` <span style="color:#545c66">(${esc(res.error)})</span>` : ""}.</div>
              <div class="line" style="color:#828c99">It refreshes 4×/day — I'll have it next time you open me.</div>`;
    }
    const b = res.data;
    const t = res.tracker;                    // may be null: feed-only fallback
    const fresh = Array.isArray(res.fresh) ? res.fresh : [];
    const ago = b.updated ? Math.round((Date.now() - new Date(b.updated)) / 36e5) : null;
    const top = Array.isArray(b.top) ? b.top : [];

    const row = (x) => `
      <div class="line role">
        <a href="#" data-url="${esc(x.url)}">${x.hot ? "🔥 " : ""}${esc(x.company)} — ${esc(x.title)}</a>
        <span style="color:#545c66"> ${esc(x.loc)}</span>
      </div>`;

    // What NEEDS him comes first — a follow-up already due costs more than a
    // role he has not applied to. Then what is new. Then the standing board.
    const needsYou = t && (t.due || t.soon.length) ? `
      <h3>Needs you</h3>
      ${t.due ? `<div class="line">⏰ <b>${t.due}</b> follow-up${t.due === 1 ? "" : "s"} due — <a href="#" data-url="https://leebrian.dev/tracker">open tracker →</a></div>` : ""}
      ${t.soon.map((s) => `<div class="line">📅 ${esc(s.what)} — ${esc(s.when)}</div>`).join("")}` : "";

    const whatsNew = fresh.length
      ? `<h3>New since you last looked</h3>${fresh.map(row).join("")}`
      : top.length ? `<h3>Worth a look</h3>${top.slice(0, 5).map(row).join("")}` : "";

    const yours = t
      ? `<div class="line">${t.live} live application${t.live === 1 ? "" : "s"}${t.appliedWeek ? ` · ${t.appliedWeek} sent this week` : ""}${t.interviews ? ` · <b style="color:#9aafe2">${t.interviews} interviewing</b>` : ""}</div>`
      : "";

    return `
      <h2>☀️ ${esc(b.cycle || "Today")}</h2>
      <div class="line"><b>${b.cycleRoles ?? 0}</b> roles this cycle · <b>${b.cycleTargets ?? 0}</b> at target companies</div>
      ${yours}
      ${needsYou}
      ${whatsNew}
      <h3>Board</h3>
      <div class="line">${b.hot ?? 0} hot · ${b.fresh ?? 0} posted in 48h · ${b.total ?? 0} total</div>
      <div class="line"><a href="#" data-url="https://leebrian.dev/tracker">Tracker →</a>  <a href="#" data-url="https://leebrian.dev/prep">Prep →</a></div>
      <div class="line" style="color:#545c66;font-size:11px">updated ${ago === null ? "—" : ago < 1 ? "just now" : ago + "h ago"}</div>`;
  }

  let shown = false;
  function showBrief(res) {
    content.innerHTML = briefToHtml(res);
    // links go to the real browser; the pet window is transparent and frameless
    content.querySelectorAll("a[data-url]").forEach(a => {
      a.onclick = (e) => { e.preventDefault(); window.pet.openUrl(a.dataset.url); };
    });
    bubble.classList.add("show");
    petEl.classList.add("talking");
    shown = true;
  }
  function hide() { bubble.classList.remove("show"); petEl.classList.remove("talking"); shown = false; }

  petEl.onclick = async () => { shown ? hide() : showBrief(await window.pet.getBrief()); };
  document.getElementById("close").onclick = (e) => { e.stopPropagation(); hide(); window.pet.hidePet(); };
  window.pet.onShowBrief(md => showBrief(md));

  // click-through management: window ignores the mouse except over interactive
  // regions. Enter a region → become interactive; leave → pass clicks through.
  document.querySelectorAll(".interactive").forEach(el => {
    el.addEventListener("mouseenter", () => window.pet.setInteractive(true));
    el.addEventListener("mouseleave", () => { if (!shown) window.pet.setInteractive(false); });
  });
  // when the bubble is open the whole bubble stays interactive; when closed,
  // only the pet region should grab the mouse
  bubble.addEventListener("mouseleave", () => { if (!petEl.matches(":hover")) window.pet.setInteractive(false); });

  // greet on launch
  window.addEventListener("DOMContentLoaded", async () => {
    setTimeout(async () => showBrief(await window.pet.getBrief()), 600);
  });
</script>
</body>
</html>
